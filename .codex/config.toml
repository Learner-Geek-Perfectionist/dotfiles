#:schema https://developers.openai.com/codex/config-schema.json
# Shared Codex CLI / Codex.app configuration baseline.
# Official user-level config path: ~/.codex/config.toml

model = "gpt-5.5"
model_context_window = 1050000
model_auto_compact_token_limit = 900000
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
model_verbosity = "low"
approvals_reviewer = "guardian_subagent"
approval_policy = "never"
sandbox_mode = "danger-full-access"
file_opener = "vscode"
hide_agent_reasoning = false
show_raw_agent_reasoning = false
suppress_unstable_features_warning = true
service_tier = "fast"

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[features]
unified_exec = true
shell_snapshot = true
multi_agent = true
personality = true
guardian_approval = true
prevent_idle_sleep = true
hooks = true
goals = true

[sandbox_workspace_write]
network_access = true

[tui]
status_line = ["model-with-reasoning", "used-tokens", "context-remaining", "context-window-size", "current-dir", "git-branch", "five-hour-limit", "weekly-limit", "codex-version"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"

[mcp_servers.tavily]
command = "npx"
args = ["-y", "tavily-mcp"]
env_vars = ["TAVILY_API_KEY"]

[mcp_servers.fetch]
command = "npx"
args = ["-y", "@kazuph/mcp-fetch"]

[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@latest",
  "--user-data-dir={{HOME}}/.cache/chrome-devtools-mcp/chrome-profile",
  "--redact-network-headers",
  "--no-usage-statistics",
  "--viewport=1600x1000",
]
startup_timeout_sec = 120

[marketplaces.openai-bundled]
source_type = "local"
source = "{{HOME}}/.codex/.tmp/bundled-marketplaces/openai-bundled"

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."cloudflare@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[desktop]
localeOverride = "zh-CN"
hotkey-window-projectless-default-enabled = false
preventSleepWhileRunning = true
codeFontSize = 12
conversationDetailMode = "STEPS_COMMANDS"
default-service-tier = "priority"

[desktop.open-in-target-preferences]
global = "vscode"

[desktop.open-in-target-preferences.perPath]
"{{HOME}}" = "vscode"
